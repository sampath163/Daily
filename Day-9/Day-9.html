<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="Day-9.css">
</head>
<body>
    <h1>Create Account :</h1>
    <section>
        <div class="form-card">
            <form>
                <input type="text" placeholder="Enter Your Name" required><br><br>
                <input type="email" placeholder="Enter Your Email" required><br><br>
                <input type="tel" placeholder="Enter Your Phone Number" required pattern="[0-9]{10}"><br><br>
                <input type="password" placeholder="Create Password" required><br><br>
                <input type="password" placeholder="Confirm Password" required><br><br>
                <input type="submit" value="Sign Up" class="submit-btn">
            </form>
            <p>Already have an account? <a href="#">Login</a></p>
        </div>
    </section>
</body>
</html>
